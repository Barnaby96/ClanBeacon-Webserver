{% extends "base.html" %}

{% block content %}
<title>Log In</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/osrs-dashboard.css') }}"
>

<style>
    .osrs-auth-page .osrs-page {
        max-width: 720px;
    }

    .osrs-auth-page .osrs-page-header {
        text-align: center;
        justify-content: center;
    }

    .osrs-auth-panel {
        max-width: 620px;
        margin: 0 auto;
    }

    .osrs-auth-form {
        display: grid;
        gap: 16px;
    }

    .osrs-auth-actions {
        display: grid;
        gap: 12px;
        margin-top: 4px;
    }

    .osrs-auth-actions .osrs-button {
        justify-content: center;
        width: 100%;
    }

    .osrs-auth-link {
        margin: 0;
        color: #2c2218;
        text-align: center;
        line-height: 1.45;
    }

    .osrs-auth-link a {
        color: #5c3512;
        font-weight: 700;
        text-decoration: underline;
    }
</style>

<div class="osrs-dashboard osrs-auth-page">
    <main class="osrs-page">
        <header class="osrs-page-header">
            <div>
                <p class="osrs-page-subtitle">
                    Account Access
                </p>

                <h1 class="osrs-page-title">
                    {{ bot_name }} Login
                </h1>
            </div>
        </header>

        <section class="osrs-panel osrs-auth-panel">
            <header class="osrs-panel-header">
                <h2 class="osrs-panel-title">
                    Log In
                </h2>
            </header>

            <div class="osrs-panel-body">
                <form method="POST" class="osrs-auth-form">
                    <div class="osrs-form-field">
                        <label class="osrs-form-label" for="username">
                            Username
                        </label>

                        <input
                            class="osrs-form-input"
                            id="username"
                            type="text"
                            name="username"
                            placeholder="Username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="osrs-form-field">
                        <label class="osrs-form-label" for="password">
                            Password
                        </label>

                        <input
                            class="osrs-form-input"
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="osrs-auth-actions">
                        <button class="osrs-button" type="submit">
                            Log In
                        </button>

                        <p class="osrs-auth-link">
                            Do not have an account?
                            <a href="{{ url_for('register') }}">
                                Create one here.
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
{% endblock %}
